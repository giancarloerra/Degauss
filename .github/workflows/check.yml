name: check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add clippy rustfmt
      - run: rustup target add armv7-unknown-linux-musleabihf
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --target armv7-unknown-linux-musleabihf --all-targets -- -D warnings
