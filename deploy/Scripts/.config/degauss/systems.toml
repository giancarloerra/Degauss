# Per-system launch parameters, MiSTer.
#
# Each entry names the core to load, the folders a system's games live in,
# the file extensions that belong to it, and the slot a file is loaded into.
#
# "mgl" in an extension list marks a system whose folders are also scanned
# for .mgl files. [[systems.launch]] maps to the delay, type and index
# attributes of the MGL <file> element.
#
# Nothing regenerates this file: edit it freely.
[[systems]]
name = "3DO"
id = "3DO"
folders = ["3DO"]
rbf = "_Console/3DO"
extensions = ["iso", "cue", "chd", "mgl"]

[[systems.launch]]
extensions = ["iso", "cue", "chd"]
type = "s"
index = 0
delay = 1

