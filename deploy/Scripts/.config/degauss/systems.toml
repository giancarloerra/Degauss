[[systems]]
name = "PC (DOS)"
id = "DOS"
folders = ["AO486", "/media/fat/_DOS Games"]
rbf = "_Computer/ao486"
extensions = ["mgl", "vhd", "img", "ima", "vfd", "iso", "cue", "chd"]

[[systems.launch]]
extensions = ["img", "ima", "vfd"]
type = "s"
index = 0
delay = 1

# IDE 0-0, the hard disk. A DOS game is usually a disk image with its CD
# beside it: the game boots from the disk and then asks for the disc, so
# mounting only the disk starts a game that cannot find itself. The .mgl
# shortcuts the card already carries do exactly this, disk at 2 and disc
# at 4, followed by a reset.
[[systems.launch]]
extensions = ["vhd"]
type = "s"
index = 2
delay = 1
reset_delay = 1
companion_extensions = ["iso", "chd", "cue"]
companion_index = 4

# IDE 1-0, the CD-ROM, when the disc is what was chosen.
[[systems.launch]]
extensions = ["iso", "cue", "chd"]
type = "s"
index = 4
delay = 1
reset_delay = 1

