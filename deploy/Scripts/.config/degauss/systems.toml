[[systems]]
# The cores the stock menu keeps under Other: Chess, Flappy Bird, Chip8,
# Arduboy and the rest. They are not games and no games folder belongs to
# them, so nothing else in this table would ever show them. A core file
# describes itself, so it needs no launch rule: it is handed to MiSTer as
# it is.
name = "Cores"
id = "OtherCores"
folders = ["/media/fat/_Other"]
rbf = ""
extensions = ["rbf", "mra", "mgl"]
category = "Other"

[[systems]]
# The test and measurement cores the stock menu keeps under Utility:
# 240p Test Suite, input lag, memory test and the rest. Same shape as the
# Other group: no games folder belongs to them, so nothing else in this
# table would ever list them, and a core file needs no launch rule because
# it describes itself.
name = "Cores"
id = "UtilityCores"
folders = ["/media/fat/_Utility"]
rbf = ""
extensions = ["rbf", "mra", "mgl"]
category = "Utility"

[[systems]]
# MiSTer's own favourites folder, exactly as its favourites script keeps
# it: folders the user named, holding an .mgl for each game and a link for
# each core file. Nothing here is Degauss's, which is the point. It is
# listed last because it is not a machine.
name = "Favorites"
id = "Favorites"
folders = ["/media/fat/_@Favorites"]
rbf = ""
extensions = ["mgl", "mra", "rbf"]
category = "Favorites"
