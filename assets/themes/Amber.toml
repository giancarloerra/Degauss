# Amber: the orange phosphor of a monochrome terminal, on a warm dark
# ground. These values are starting points, meant to be tuned on a real
# tube. Edits to this file are overwritten by the updater; copy it under a
# new name to keep your own version. No favorite colour on purpose: the
# hearts keep the standard red, whatever the palette.

