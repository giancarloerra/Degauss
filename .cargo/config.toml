# Cross-linking without a C toolchain.
#
# Rust ships an ELF linker (rust-lld) and a self-contained musl libc. The
# HTTPS cryptography dependency additionally uses Clang at build time;
# scripts/build-arm.sh selects it without adding a runtime dependency.
#
# rust-lld is named rather than pathed, so it resolves inside whichever
# toolchain is active on the machine doing the build.
[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld"]
